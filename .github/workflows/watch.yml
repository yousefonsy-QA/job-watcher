name: Job Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      test_message:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

concurrency:
  group: job-watcher
  cancel-in-progress: false

permissions:
  contents: write             # commit watcher_seen.json / watcher_state.json / jobs.json back

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-check filters
        run: python test_job_watcher.py

      - name: Check job boards and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py ${{ inputs.test_message && '--test' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --notify-failure

      - name: Save state
        if: always()
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python push_state.py "state: github run $(date -u +%Y-%m-%dT%H:%MZ)"
